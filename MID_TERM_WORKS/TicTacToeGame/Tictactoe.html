<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TicTacToe</title>
    <link rel="stylesheet" href="Tictactoe.css">
    <script src="Tictactoe.js"></script>
</head>
<body>

    <div class="game-container">
        <h1>TicTacToe</h1>
        
        <div id="status">Player X's Turn</div>
        
        <div id="score">Player X's total won: <span id="x-wins">0</span> | Player O's total won: <span id="o-wins">0</span></div>

        <div class="board">
            <div class="cell" id="c0" onclick="handleMove(0)"></div>
            <div class="cell" id="c1" onclick="handleMove(1)"></div>
            <div class="cell" id="c2" onclick="handleMove(2)"></div>
            <div class="cell" id="c3" onclick="handleMove(3)"></div>
            <div class="cell" id="c4" onclick="handleMove(4)"></div>
            <div class="cell" id="c5" onclick="handleMove(5)"></div>
            <div class="cell" id="c6" onclick="handleMove(6)"></div>
            <div class="cell" id="c7" onclick="handleMove(7)"></div>
            <div class="cell" id="c8" onclick="handleMove(8)"></div>
        </div>

        <button onclick="reset()">Restart Game</button>
    </div>

</body>
</html>
